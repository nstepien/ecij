# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Dependabot waits 3 days before proposing a new release by default. Consumers get new
    # Rolldown and Vite releases right away within ecij's peer ranges, so propose those
    # immediately to catch compatibility issues first. Dev-only tooling keeps the delay as a
    # supply chain safeguard.
    cooldown:
      exclude:
        - 'rolldown'
        - 'vite'
    groups:
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/coverage-v8'
        update-types:
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - '*'
