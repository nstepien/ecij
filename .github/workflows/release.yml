name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 0.1.1, 0.2.0, or 1.0.0'
        required: true
        type: string

permissions: {}

cache-mode: none

# One release at a time, never cancelled midway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Dependencies only run in this read-only job, so they cannot mint an npm publishing token
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: node --run format:check

      - name: Lint
        run: node --run lint

      - name: Type check
        run: node --run typecheck

      - name: Build
        run: node --run build

      - name: Lint package
        run: node --run lint:package

      - name: Run tests
        run: node --run test

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Push the tag and create the GitHub release
      id-token: write # Publish to npm with trusted publishing
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Update version
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          npm version "$VERSION"

      - name: Push tag
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}

      # https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
