# To release a new version, run these commands on an up-to-date main branch:
#
#   npm version <patch|minor|major|x.y.z>
#   git push --atomic --no-follow-tags origin main "v$(npm pkg get version)"
#
# `npm version` commits the new version and tags it, and the push updates main and the tag together,
# bypassing the default branch ruleset as an admin. Naming the tag makes the push fail if the tag is
# missing, and `--no-follow-tags` leaves other local tags out, even with `push.followTags` set.
#
# Until it's pushed, any fetch that prunes tags, like an editor's auto-fetch, deletes the new tag.
# If the push can't find it, recreate it and push again:
#
#   git tag --annotate "v$(npm pkg get version)" --message "$(npm pkg get version)"
#
# The new tag runs this workflow, which checks the tagged commit, publishes it to npm, and creates
# the GitHub release.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

cache-mode: none

env:
  FORCE_COLOR: 1

# One release at a time, never canceled midway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Dependencies only run in this read-only job, so they cannot mint an npm publishing token
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Check out the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          package-manager-cache: false

      - name: Check that the tag is on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Check that the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: node --run format:check

      - name: Lint
        run: node --run lint

      - name: Type check
        run: node --run typecheck

      - name: Build
        run: node --run build

      - name: Lint package
        run: node --run lint:package

      - name: Run tests
        run: node --run test

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Check out the repository
      id-token: write # Publish to npm with trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # https://docs.npmjs.com/trusted-publishers
      # `--ignore-scripts` skips the package's lifecycle scripts, so no project code runs either
      - name: Publish to npm
        run: npm publish --ignore-scripts

  # A separate job, so the job that can publish to npm has no write token, and a failed release can
  # be rerun once the version is already on npm
  release:
    name: Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Create the GitHub release

    steps:
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
