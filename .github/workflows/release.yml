name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.1, 0.2.0, 1.0.0)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: node --run format:check

      - name: Type check
        run: node --run typecheck

      - name: Build
        run: node --run build

      - name: Run tests
        run: node --run test

      - name: Update version
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          npm version ${{ inputs.version }}

      - name: Push tag
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        run: gh release create v${{ inputs.version }} --title "v${{ inputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
