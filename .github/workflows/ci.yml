name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

cache-mode: none

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read # Check out the repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['24', '26', '27']
        include:
          # Unlike `27`, this range also matches the alphas that precede 27.0.0
          - node-version: '27'
            node-version-range: '^27.0.0-0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version-range || matrix.node-version }}
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: node --run format:check

      - name: Lint
        run: node --run lint

      - name: Type check
        run: node --run typecheck

      - name: Build
        run: node --run build

      - name: Lint package
        run: node --run lint:package

      - name: Run tests
        run: node --run test

  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Check out the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://docs.zizmor.sh/
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: false
          annotations: true
