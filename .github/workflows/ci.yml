name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['lts/*', current]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: node --run format:check

      - name: Lint
        run: node --run lint

      - name: Type check
        run: node --run typecheck

      - name: Build
        run: node --run build

      - name: Check published files
        # bash sets pipefail, and .[] reads both npm 12's packages keyed by name and older npm's array
        shell: bash
        run: |
          npm pack --dry-run --json | jq --slurpfile package package.json '
            [$package[0].exports[][] | ltrimstr("./")] - [.[].files[].path]
            | if . != [] then error("Exported files missing from the package: \(join(", "))") else empty end
          '

      - name: Run tests
        run: node --run test
